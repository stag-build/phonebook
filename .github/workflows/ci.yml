name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: node scripts/check-versions-agree.mjs
      - run: npm run build
      - run: npm test

  # Everything above is unit tests: synthetic .pbxproj text, no real Xcode, no
  # real SnapshotPreviews harness. That is exactly the gap that let two real
  # bugs through unnoticed — a SNAPSHOTS_ONLY_FILTER anchor that could never
  # match a *named* preview, and target resolution that had no path at all for
  # a file inside a local Swift package — because nothing here ever ran the
  # actual `generate --files` an agent runs against a real project. This job
  # does: a real `xcodebuild test` against samples/ios, through the same
  # --files code path, asserted against the specific shape a correct narrow
  # render has to produce. It runs on every PR, not just on push to main, so a
  # regression here blocks the merge instead of shipping and being found later
  # by someone's real repository.
  ios-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Ensure iPhone 17 Pro simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone 17 Pro"; then
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; rt=[r for r in json.load(sys.stdin)['runtimes'] if r['name'].startswith('iOS')]; print(sorted(rt, key=lambda r: r['version'])[-1]['identifier'])")
            xcrun simctl create "iPhone 17 Pro" "iPhone 17 Pro" "$RUNTIME"
          fi

      # The regression case itself: UserCard.swift declares two *named*
      # previews ("UserCard/Default", "UserCard/Dark") alongside two other
      # sample components (Button, StatusBadge) that must NOT appear in the
      # output. A SNAPSHOTS_ONLY_FILTER anchor that cannot match a named
      # preview renders nothing here; one that silently falls back to
      # "everything" renders all three components' previews instead of two.
      # Either failure mode is real and both shipped before this test existed.
      - name: Render only UserCard.swift's previews, by name
        run: |
          node dist/cli.js generate -C samples/ios -o /tmp/narrowed-render --files PhonebookSample/Components/UserCard.swift
          node scripts/verify-narrowed-render-manifest.mjs /tmp/narrowed-render/manifest.json

  # The Android counterpart, and for the same reason: everything in
  # build-and-test is unit tests with a faked Gradle invocation, which is what
  # let a stale-harvest bug ship. `generate --files` narrowed Gradle correctly
  # but then copied the module's *entire* Roborazzi output directory into the
  # bundle, so PNGs from an earlier run were reported in the manifest as if
  # this run had rendered them. Nothing downstream could notice: the images
  # were byte-identical and the manifest carries no timestamp or run id. Only a
  # real Gradle run against a dirty output directory catches that, so this job
  # deliberately seeds one before running.
  android-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Record everything once, so the Roborazzi output directory holds all six
      # of the sample's previews — the "leftover from an earlier run" state.
      - name: Record every preview, to dirty the output directory
        run: node dist/cli.js generate -C samples/android -o /tmp/android-full

      # Now ask for one file. A correct run rewrites only PrimaryButton.kt's
      # two previews; the harvest must not pick up the four Badge/UserCard PNGs
      # still sitting in build/outputs/roborazzi from the step above.
      - name: Render only PrimaryButton.kt's previews, over a dirty output dir
        run: |
          node dist/cli.js generate -C samples/android -o /tmp/android-narrowed --files app/src/main/java/dev/stag/phonebook/sample/PrimaryButton.kt
          node scripts/verify-fresh-android-manifest.mjs /tmp/android-narrowed/manifest.json Button Enabled Disabled

      # The inverse: an unfiltered run after a narrowed one must still produce
      # the whole app, not just the file the previous run happened to touch.
      - name: Record every preview again, after a narrowed run
        run: |
          node dist/cli.js generate -C samples/android -o /tmp/android-full-again
          node -e "
            const m = require('/tmp/android-full-again/manifest.json');
            const got = m.entries.map(e => e.component + '/' + e.state).sort();
            const want = ['Badge/Error','Badge/Success','Button/Disabled','Button/Enabled','User Card/Dark','User Card/Default'];
            if (JSON.stringify(got) !== JSON.stringify(want)) {
              console.error('unfiltered generate did not render the whole sample app');
              console.error('  wanted: ' + want.join(', '));
              console.error('  got:    ' + got.join(', '));
              process.exit(1);
            }
            console.log('OK: unfiltered generate still renders all ' + got.length + ' previews.');
          "
