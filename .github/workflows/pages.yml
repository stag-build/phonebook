name: Publish demo gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Ensure iPhone 17 Pro simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone 17 Pro"; then
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; rt=[r for r in json.load(sys.stdin)['runtimes'] if r['name'].startswith('iOS')]; print(sorted(rt, key=lambda r: r['version'])[-1]['identifier'])")
            xcrun simctl create "iPhone 17 Pro" "iPhone 17 Pro" "$RUNTIME"
          fi

      - run: node dist/cli.js generate -C samples/ios
      - run: node dist/cli.js build samples/ios/phonebook-out -o phonebook-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: phonebook-site

  deploy:
    needs: gallery
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
