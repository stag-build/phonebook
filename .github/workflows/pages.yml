name: Publish demo gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: node dist/cli.js generate -C samples/ios
      - run: node dist/cli.js build samples/ios/phonebook-out -o phonebook-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: samples/ios/phonebook-site

  deploy:
    needs: gallery
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
