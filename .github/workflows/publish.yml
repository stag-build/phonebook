name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing (OIDC) needs npm >= 11.5.1, which itself needs
      # Node >= 22.22 to install — hence node-version: 'lts/*' above. No NPM_TOKEN
      # secret: npm exchanges this job's OIDC token for a short-lived publish
      # credential, verified against the Trusted Publisher configured on the
      # npm package settings (GitHub org/repo + this workflow filename). See
      # https://docs.npmjs.com/trusted-publishers
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test

      # Skip if this version is already on npm — lets the job be re-run (or
      # dispatched manually) purely to sync the MCP registry.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@stag-build/phonebook@$VERSION" version >/dev/null 2>&1; then
            echo "@stag-build/phonebook@$VERSION already on npm, skipping publish"
          else
            npm publish --access public
          fi

      # The MCP registry only stores metadata; it validates ownership of the
      # io.github.stag-build/* namespace from this job's OIDC token, which is
      # issued to the repo itself — so it does not depend on any individual's
      # org membership being public.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP registry
        run: ./mcp-publisher publish
