name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing (OIDC) needs npm >= 11.5.1, which itself needs
      # Node >= 22.22 to install — hence node-version: 'lts/*' above. No NPM_TOKEN
      # secret: npm exchanges this job's OIDC token for a short-lived publish
      # credential, verified against the Trusted Publisher configured on the
      # npm package settings (GitHub org/repo + this workflow filename). See
      # https://docs.npmjs.com/trusted-publishers
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
